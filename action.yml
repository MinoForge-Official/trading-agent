name: "Trading Agent & Market Scanner"
description: "Autonomous multi-market trading agent for algorithmic market scanning, backtesting, and automated trade alerts"
author: "MinoForge-Official"
branding:
  icon: "trending-up"
  color: "green"

inputs:
  symbols:
    description: "Comma-separated list of symbols (e.g. AAPL,MSFT,NVDA,BTC-USD)"
    required: false
    default: "AAPL,MSFT,NVDA,BTC-USD"
  strategy:
    description: "Trading strategy to evaluate (ema, rsi, bb, composite, ai)"
    required: false
    default: "composite"
  mode:
    description: "Execution mode: scan, backtest, or paper-trade"
    required: false
    default: "scan"
  days:
    description: "Lookback window in days for backtesting"
    required: false
    default: "180"
  create-issue-alert:
    description: "Whether to create a GitHub Issue if high-conviction buy/sell signals occur"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Trading Agent dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Execute Trading Agent Action
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        EXTRA_FLAGS=""
        if [ "${{ inputs.create-issue-alert }}" = "true" ]; then
          EXTRA_FLAGS="--create-issue-alert"
        fi
        python -m trading_agent.github_tool.cli \
          --symbols "${{ inputs.symbols }}" \
          --strategy "${{ inputs.strategy }}" \
          --mode "${{ inputs.mode }}" \
          --days "${{ inputs.days }}" \
          $EXTRA_FLAGS